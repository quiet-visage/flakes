version: '3'

vars:
  TOOLBOX_NAME: fedora-toolbox-44
  SRC_DIR: /var/home/anon/projects/Flakes
  STEAM_DIR: /var/home/anon/.var/app/com.valvesoftware.Steam/TeamFortress2-Linux-Internal

tasks:
  default:
    desc: Sync and inject into TF2 (run from host)
    cmds:
      - task: inject

  build:
    desc: Build tf2.so inside Toolbx (or directly if already in Toolbx) and sync
    dir: '{{.SRC_DIR}}'
    cmds:
      - |
        if [ -f /.toolboxenv ] || [ -f /run/.toolboxenv ] || [ -f /run/.containerenv ]; then
          make -C "{{.SRC_DIR}}" tf2.so
        else
          toolbox run -c {{.TOOLBOX_NAME}} make -C "{{.SRC_DIR}}" tf2.so
        fi
      - task: sync

  sync:
    desc: Copy built tf2.so, inject.sh, Taskfile.yml, and Makefile to Steam Flatpak directory
    cmds:
      - mkdir -p "{{.STEAM_DIR}}"
      - chmod +x "{{.SRC_DIR}}/scripts/inject.sh"
      - cp -f --remove-destination "{{.SRC_DIR}}/tf2.so" "{{.STEAM_DIR}}/tf2.so"
      - cp -f --remove-destination "{{.SRC_DIR}}/scripts/inject.sh" "{{.STEAM_DIR}}/inject.sh"
      - cp -f --remove-destination "{{.SRC_DIR}}/Taskfile.yml" "{{.STEAM_DIR}}/Taskfile.yml"
      - cp -f --remove-destination "{{.SRC_DIR}}/Makefile" "{{.STEAM_DIR}}/Makefile"
      - chmod +x "{{.STEAM_DIR}}/inject.sh"

  ptrace:
    desc: Enable ptrace_scope=0 on the host
    cmds:
      - sudo sysctl -w kernel.yama.ptrace_scope=0

  inject:
    desc: Sync files and inject tf2.so using Toolbx mount namespace (run from host)
    deps: [sync]
    cmds:
      - |
        TPID=$(podman inspect -f '{{ "{{" }}.State.Pid{{ "}}" }}' {{.TOOLBOX_NAME}})
        sudo nsenter -t "$TPID" -m "{{.STEAM_DIR}}/inject.sh"

  logs:
    desc: Tail the live /tmp/tf2.log inside the TF2 container
    cmds:
      - sudo tail -n +1 -f "/proc/$(pgrep tf_linux64 | head -n 1)/root/tmp/tf2.log"
